# ohif-ai-viewer.conf
#
# Nginx config for the OHIF-AI viewer container on Server 1. This serves the
# static bundles and NOTHING ELSE.
#
# Routing is Nginx Proxy Manager's job, on one origin
# (https://ai-viewer.hospital.lan):
#
#   /            -> ohif-ai-viewer:80       this container
#   /dicom-web   -> orthanc-cors-proxy:80   injects Basic auth, server-side
#   /wado        -> orthanc-cors-proxy:80
#   /monai       -> Server 2, monai_server  behind server2-proxy
#
# One origin is what keeps the browser from issuing CORS preflights and from
# ever seeing a password prompt: Orthanc answers only authenticated requests,
# and orthanc-cors-proxy supplies the credential server-side.
#
# SINGLE-FILE BIND MOUNT. Docker binds this by inode, so `sed -i` and most
# editors replace it and leave the container serving stale content. Change it
# with `cat new > file`, then verify with:
#   docker exec ohif-ai-viewer cat /etc/nginx/conf.d/default.conf
#
# NPM connects over the Docker network, so its proxy host must target port
# **80** here, not any published port. Using the published port gives 502.

server {
    listen 80;
    server_name _;

    # The image puts the built bundles here, not in nginx's default root.
    root /var/www/html;
    index index.html;

    # gzip the bundles; they are ~213 MB unpacked and this is a LAN, not a CDN.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json
               application/wasm image/svg+xml;
    gzip_min_length 1024;

    # Never cache the service worker, or clients pin themselves to an old build.
    # OHIF-AI ships one, and it only registers in a secure context - which is
    # why this viewer must be served over HTTPS by NPM, not plain HTTP.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        expires off;
        access_log off;
    }

    # Content-hashed assets: safe to cache hard.
    location ~* \.(js|css|woff2?|wasm|png|jpg|jpeg|gif|svg)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Single-page app: unknown paths are client-side routes, not 404s.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # No Access-Control-Allow-Origin here on purpose. The upstream recipe sets
    # '*', which it needs because it serves DICOM from a different path. In the
    # same-origin design nothing cross-origin is expected, and advertising '*'
    # on a clinical viewer invites exactly what this layout avoids.

    error_page 405 =200 $uri;
}
