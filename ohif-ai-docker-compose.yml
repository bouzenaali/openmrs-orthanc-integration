# ohif-ai-docker-compose.yml
#
# The OHIF-AI viewer: a SECOND, independent viewer alongside the existing one.
# Nothing about ohif-viewer (OHIF 3.9.2) changes - same image, same config, same
# proxy host. See OHIF-AI.md §1.
#
# Run alongside the other compose files:
#   docker compose -f openmrs-docker-compose.yml -f orthanc-docker-compose.yml \
#                  -f ohif-docker-compose.yml -f ohif-ai-docker-compose.yml up -d
#
# Deployed shape - Nginx Proxy Manager serves everything from ONE origin,
# https://ai-viewer.hospital.lan:
#
#   /           -> ohif-ai-viewer:80        (static bundles, this container)
#   /dicom-web  -> orthanc-cors-proxy:80    (injects Basic auth, server-side)
#   /wado       -> orthanc-cors-proxy:80
#   /monai      -> Server 2, monai.hospital.lan   (GPU backend)
#
# One origin is what keeps the browser from issuing CORS preflights and from ever
# seeing a password prompt.
#
# NO "ports:" ON PURPOSE. NPM connects over the Docker network, so nothing needs
# publishing - and a published port would be reachable from the whole hospital
# LAN, which is exactly the defect that let anything on the network read and
# write the PACS through 8043 (ohif-ai-integration.md §2.2).
#
# NPM must target the INTERNAL port 80. Using a published port yields 502 - the
# most common deployment mistake in this stack.

services:
  ohif-ai-viewer:
    # Built on Server 2 from the CCI-Bonn/OHIF-AI fork with APP_CONFIG=
    # config/chu-production.js, then streamed here with `docker save | docker load`.
    # Server 1's 7 GB is shared with OpenMRS, MySQL, Orthanc and NPM; an OHIF
    # webpack build is not a good neighbour. See ohif-ai-integration.md §5.3.
    image: webapp:prod
    container_name: ohif-ai-viewer
    restart: always
    volumes:
      # SINGLE-FILE BIND MOUNT - Docker binds the inode. `sed -i` and most editors
      # replace it and leave the container serving stale content. Truncate in
      # place with `cat new > file`, then verify with:
      #   docker exec ohif-ai-viewer cat /etc/nginx/conf.d/default.conf
      - ./ohif-ai-viewer.conf:/etc/nginx/conf.d/default.conf:ro
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/index.html"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
