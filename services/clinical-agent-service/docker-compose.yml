# DEVELOPMENT ONLY - the agent on its own, no TLS, bound to loopback.
#
# For the real deployment use ../../server2-stack/, which puts Nginx in front, terminates TLS,
# restricts the assistant to Server 1's address, and gives OHIF and anything else added later a
# place to slot in. Do not run this file on Server 2: it publishes the raw HTTP port, which means
# anything that can reach the host can talk to the assistant without TLS and without the proxy's
# access rules - the channel secret and the signed token would be the only things left.

services:
  clinical-agent:
    build: .
    container_name: clinical-agent-dev
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
